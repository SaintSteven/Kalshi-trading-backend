services:
  - type: web
    name: prediction-market-quotes-v3
    runtime: python
    plan: free
    rootDir: pricing_connector
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
