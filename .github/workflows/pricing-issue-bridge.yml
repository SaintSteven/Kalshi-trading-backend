name: Research v3 on-demand pricing bridge
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  quote:
    if: github.event.issue.user.login == 'SaintSteven' && startsWith(github.event.issue.title, '[pricing-v3]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Retrieve direct exchange quote snapshots and comment on issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pricing_connector/issue_quote_bridge.py
