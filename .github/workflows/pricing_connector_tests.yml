name: Research v3 Pricing Connector Tests
on:
  push:
    paths:
      - 'pricing_connector/**'
      - '.github/workflows/pricing_connector_tests.yml'
  pull_request:
    paths:
      - 'pricing_connector/**'
      - '.github/workflows/pricing_connector_tests.yml'
jobs:
  test-pricing-connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pricing_connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q app.py engine.py
