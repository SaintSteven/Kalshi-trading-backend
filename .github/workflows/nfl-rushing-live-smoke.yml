name: NFL Rushing Live Smoke
on:
  push:
    branches: [ "research/nfl-rushing-live-v1" ]
    paths:
      - ".github/workflows/nfl-rushing-live-smoke.yml"
      - "research/nfl_prospective_paper_v001/generate_rushing_projections.py"
      - "research/nfl_prospective_paper_v001/rushing_feed.py"
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests
      - run: mkdir -p /tmp/nfl-rushing-smoke
      - name: Generate rushing projections
        run: python research/nfl_prospective_paper_v001/generate_rushing_projections.py --markets research/nfl_prospective_paper_v001/data/current_markets.csv --projections /tmp/nfl-rushing-smoke/rushing_projections.csv --mapping /tmp/nfl-rushing-smoke/rushing_mapping.csv
      - name: Build rushing fair-value feed
        run: python research/nfl_prospective_paper_v001/rushing_feed.py --markets research/nfl_prospective_paper_v001/data/current_markets.csv --projections /tmp/nfl-rushing-smoke/rushing_projections.csv --mapping /tmp/nfl-rushing-smoke/rushing_mapping.csv --output /tmp/nfl-rushing-smoke/rushing_fair_values.csv
      - name: Verify rushing feed
        run: |
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('/tmp/nfl-rushing-smoke/rushing_projections.csv').fillna('')
          f=pd.read_csv('/tmp/nfl-rushing-smoke/rushing_fair_values.csv').fillna('')
          assert len(p)>0,'no rushing projections'
          assert set(p.model_version)=={'NFL-RUSH-RIDGE-NORMALSD-ISO-v1'}
          assert (f.qc_status=='MODEL_AVAILABLE').any(),'no rushing model probabilities exposed'
          print({'projection_rows':len(p),'model_available':int((f.qc_status=='MODEL_AVAILABLE').sum()),
                 'week1_flagged':int(p.context_flags.astype(str).str.contains('WEEK1_').sum()),
                 'qb_review':int(p.context_flags.astype(str).str.contains('WEEK1_QB_RUSHING_REVIEW').sum()),
                 'established_rb':int(p.context_flags.astype(str).str.contains('WEEK1_ESTABLISHED_RETURNING_RB').sum())})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-rushing-live-smoke
          path: /tmp/nfl-rushing-smoke/
