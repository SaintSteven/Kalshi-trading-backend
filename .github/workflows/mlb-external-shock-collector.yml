name: MLB External Shock Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - '.github/workflows/mlb-external-shock-collector.yml'

permissions:
  contents: write

concurrency:
  group: mlb-external-shock-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect official MLB information shocks and Kalshi state
        run: python mlb_external_shock_collector.py

      - name: Persist prospective research dataset
        run: |
          if git diff --quiet -- research_data/mlb_external_shocks && [ -z "$(git status --porcelain research_data/mlb_external_shocks)" ]; then
            echo "No research-data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_data/mlb_external_shocks
          git commit -m "Capture MLB external-shock research snapshot"
          git push
