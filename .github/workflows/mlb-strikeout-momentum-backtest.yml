name: MLB Strikeout Momentum Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - 'mlb_strikeout_momentum_backtest.py'
      - '.github/workflows/mlb-strikeout-momentum-backtest.yml'

jobs:
  run-momentum-backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run July-August strikeout momentum execution test
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from mlb_strikeout_momentum_backtest import run_momentum_backtest

          async def progress(payload):
              print(payload, flush=True)

          result = asyncio.run(run_momentum_backtest(
              start_date='2026-07-01',
              end_date='2026-08-31',
              trigger_cents=3.0,
              unit_size=1.0,
              fee_rate=0.07,
              max_age_minutes=20.0,
              max_spread_cents=12,
              lookback_hours=6.0,
              progress_callback=progress,
          ))
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/mlb_strikeout_momentum_backtest.json').write_text(
              json.dumps(result, indent=2, default=str), encoding='utf-8'
          )
          summary = {
              'discovery_sample_warning': result.get('discovery_sample_warning'),
              'T-1h': result.get('by_exit', {}).get('T-1h', {}).get('overall'),
              'T-10m': result.get('by_exit', {}).get('T-10m', {}).get('overall'),
              'T-1h_by_month': result.get('by_exit', {}).get('T-1h', {}).get('by_month'),
              'T-10m_by_month': result.get('by_exit', {}).get('T-10m', {}).get('by_month'),
              'T-1h_by_side': result.get('by_exit', {}).get('T-1h', {}).get('by_side'),
              'T-10m_by_side': result.get('by_exit', {}).get('T-10m', {}).get('by_side'),
              'diagnostics': result.get('diagnostics'),
          }
          print(json.dumps(summary, indent=2, default=str))
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: mlb-strikeout-momentum-backtest
          path: artifacts/mlb_strikeout_momentum_backtest.json
          retention-days: 30
