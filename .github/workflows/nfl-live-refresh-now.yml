name: NFL Live Refresh Now
on:
  push:
    branches: [ "nfl-collector-fix" ]
    paths:
      - ".github/workflows/nfl-live-refresh-now.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-collector-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests
      - name: Collect current markets
        run: python research/nfl_prospective_paper_v001/current_collector.py --current research/nfl_prospective_paper_v001/data/current_markets.csv --health research/nfl_prospective_paper_v001/data/collector_health.csv
      - name: Generate validated receiving probabilities
        run: python research/nfl_prospective_paper_v001/generate_receiving_projections.py --markets research/nfl_prospective_paper_v001/data/current_markets.csv --projections research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv --mapping research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv
      - name: Build receiving fair-value feed
        run: python research/nfl_prospective_paper_v001/receiving_feed.py --markets research/nfl_prospective_paper_v001/data/current_markets.csv --projections research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv --mapping research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv --output research/nfl_prospective_paper_v001/data/receiving_fair_values.csv
      - name: Verify model version
        run: python research/nfl_prospective_paper_v001/week1_smoke_check.py
      - name: Commit refreshed live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nfl_prospective_paper_v001/data/current_markets.csv
          git add research/nfl_prospective_paper_v001/data/collector_health.csv
          git add research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv
          git add research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv
          git add research/nfl_prospective_paper_v001/data/receiving_fair_values.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NFL validated live data"
          git push origin HEAD:nfl-collector-fix
