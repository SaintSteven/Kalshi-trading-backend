name: MLB Market Efficiency Scanner v0.01
on:
  workflow_dispatch:
  push:
    branches: [mlb-market-efficiency-v001]
    paths:
      - 'research/mlb_market_efficiency_v001/**'
      - '.github/workflows/mlb-market-efficiency-v001.yml'
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - name: Discover MLB series
        run: python research/mlb_market_efficiency_v001/scanner.py --mode inventory --out inventory_output
      - name: Require inventory
        run: test -s inventory_output/mlb_series_inventory.csv
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-v001-inventory-${{ github.run_number }}
          path: inventory_output/
          retention-days: 7
  scan:
    needs: inventory
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - uses: actions/download-artifact@v4
        with:
          name: mlb-v001-inventory-${{ github.run_number }}
          path: inventory
      - name: Scan shard ${{ matrix.shard }}
        run: |
          python research/mlb_market_efficiency_v001/scanner.py \
            --mode scan \
            --inventory inventory/mlb_series_inventory.csv \
            --out shard_output \
            --start 2026-07-01 \
            --end 2026-08-31 \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 8
      - name: Require shard completion
        run: test -s shard_output/market_ledger.csv && test -s shard_output/SHARD_DONE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-v001-shard-${{ matrix.shard }}-${{ github.run_number }}
          path: shard_output/
          retention-days: 14
  aggregate:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: mlb-v001-shard-*-${{ github.run_number }}
          path: shard_artifacts
          merge-multiple: false
      - name: Aggregate discovery map
        run: python research/mlb_market_efficiency_v001/aggregate.py --root shard_artifacts --out aggregate_output
      - name: Require final output
        run: test -s aggregate_output/SUMMARY.md && test -s aggregate_output/summary.json && test -s aggregate_output/market_ledger.csv
      - name: Write summary
        run: cat aggregate_output/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-market-efficiency-v001-${{ github.run_number }}
          path: aggregate_output/
          retention-days: 30
