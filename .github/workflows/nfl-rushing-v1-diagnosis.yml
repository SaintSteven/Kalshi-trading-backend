name: NFL Rushing Calibration Diagnosis
on:
  push:
    branches: [refactor/nfl-gameday-engine]
    paths: ['research/nfl_rushing_v1/DIAG_TRIGGER']
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nfl-rushing-v1-results-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35930249310
          path: prior
      - run: pip install pandas numpy
      - run: python research/nfl_rushing_v1/diagnose.py --input prior/player_thesis_backtest.csv --out diagnosis | tee diagnosis/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-rushing-v1-diagnosis
          path: diagnosis/
          retention-days: 30
