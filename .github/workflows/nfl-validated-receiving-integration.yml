name: NFL Validated Receiving Integration
on:
  push:
    branches: [ "research/nfl-validated-receiving-v1" ]
    paths:
      - "research/nfl_prospective_paper_v001/generate_receiving_projections.py"
      - "research/nfl_prospective_paper_v001/receiving_feed.py"
      - ".github/workflows/nfl-validated-receiving-integration.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn
      - name: Compile
        run: |
          python -m py_compile research/nfl_prospective_paper_v001/generate_receiving_projections.py
          python -m py_compile research/nfl_prospective_paper_v001/receiving_feed.py
      - name: Generate validated receiving probabilities
        run: |
          mkdir -p /tmp/nflvalidated
          python research/nfl_prospective_paper_v001/generate_receiving_projections.py             --markets research/nfl_prospective_paper_v001/data/current_markets.csv             --projections /tmp/nflvalidated/independent_receiving_projections.csv             --mapping /tmp/nflvalidated/receiving_market_mapping.csv
      - name: Build validated receiving feed
        run: |
          python research/nfl_prospective_paper_v001/receiving_feed.py             --markets research/nfl_prospective_paper_v001/data/current_markets.csv             --projections /tmp/nflvalidated/independent_receiving_projections.csv             --mapping /tmp/nflvalidated/receiving_market_mapping.csv             --output /tmp/nflvalidated/receiving_fair_values.csv
      - name: Verify probability coherence and QC
        run: |
          python - <<'PY'
          import pandas as pd, numpy as np
          p=pd.read_csv('/tmp/nflvalidated/independent_receiving_projections.csv')
          f=pd.read_csv('/tmp/nflvalidated/receiving_fair_values.csv')
          assert len(p)>0, 'no projection rows'
          assert p['fair_yes'].between(0,1).all()
          assert p['raw_fair_yes'].between(0,1).all()
          assert set(p['model_version'].dropna().unique())=={'NFL-REC-RIDGE-NORMALSD-ISO-v1'}
          bad=[]
          for _,g in p.groupby(['game_id','player_id']):
              g=g.sort_values('threshold')
              if not np.all(np.diff(g['fair_yes'].to_numpy(float))<=1e-12):
                  bad.append((g.iloc[0].game_id,g.iloc[0].player_id))
          assert not bad, f'non-monotone probability ladders: {bad[:5]}'
          available=f[f.qc_status.eq('MODEL_AVAILABLE')]
          print({
            'projection_rows':len(p),
            'projection_pass':int(p.qc_status.eq('PASS').sum()),
            'projection_warn':int(p.qc_status.eq('WARN').sum()),
            'feed_rows':len(f),
            'model_available':len(available),
            'context_flagged':int(p.context_flags.fillna('').ne('').sum()),
            'current_season_unvalidated':int(p.qc_reason.fillna('').str.contains('CURRENT_SEASON_HISTORY_UNVALIDATED').sum())
          })
          print('\nSAMPLE AVAILABLE')
          print(available.head(12).to_string(index=False))
          print('\nSAMPLE WARN')
          print(p[p.qc_status.eq('WARN')].head(12).to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-validated-receiving-integration
          path: /tmp/nflvalidated/
