name: NFL Live Refresh Now 2
on:
  push:
    branches: [ "nfl-collector-fix" ]
    paths:
      - ".github/workflows/nfl-live-refresh-now2.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nfl-collector-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scikit-learn requests
      - run: python research/nfl_prospective_paper_v001/current_collector.py --current research/nfl_prospective_paper_v001/data/current_markets.csv --health research/nfl_prospective_paper_v001/data/collector_health.csv
      - run: python research/nfl_prospective_paper_v001/generate_receiving_projections.py --markets research/nfl_prospective_paper_v001/data/current_markets.csv --projections research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv --mapping research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv
      - run: python research/nfl_prospective_paper_v001/receiving_feed.py --markets research/nfl_prospective_paper_v001/data/current_markets.csv --projections research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv --mapping research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv --output research/nfl_prospective_paper_v001/data/receiving_fair_values.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-live-refresh-output
          path: |
            research/nfl_prospective_paper_v001/data/current_markets.csv
            research/nfl_prospective_paper_v001/data/collector_health.csv
            research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv
            research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv
            research/nfl_prospective_paper_v001/data/receiving_fair_values.csv
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nfl_prospective_paper_v001/data/current_markets.csv research/nfl_prospective_paper_v001/data/collector_health.csv research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv research/nfl_prospective_paper_v001/data/receiving_fair_values.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh NFL validated live data"
          git push origin HEAD:nfl-collector-fix
