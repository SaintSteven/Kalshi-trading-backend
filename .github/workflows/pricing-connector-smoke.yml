name: Cross-sport deployed API smoke check
on:
  push:
    branches:
      - feature/research-v3-cross-sport-pricing
    paths:
      - "pricing_connector/**"
      - ".github/workflows/pricing-connector-smoke.yml"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python pricing_connector/ci_smoke.py
