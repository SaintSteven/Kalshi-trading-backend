name: Read-only pricing connector tests
on:
  push:
    paths:
      - "pricing_connector/**"
      - ".github/workflows/pricing-connector-tests.yml"
  pull_request:
    paths:
      - "pricing_connector/**"
      - ".github/workflows/pricing-connector-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pricing_connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -c "from app import app; assert '/v1/compare' in app.openapi()['paths']"
