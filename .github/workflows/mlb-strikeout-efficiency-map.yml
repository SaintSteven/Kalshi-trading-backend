name: MLB Strikeout Efficiency Map

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mlb-strikeout-efficiency-map.yml'

jobs:
  run-efficiency-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run July-August strikeout efficiency map
        run: |
          python - <<'PY'
          import asyncio, json
          from pathlib import Path
          from mlb_strikeout_efficiency_map import run_efficiency_map

          async def progress(payload):
              print(payload, flush=True)

          result = asyncio.run(run_efficiency_map(
              start_date='2026-07-01',
              end_date='2026-08-31',
              lookback_hours=6.0,
              max_age_minutes=20.0,
              max_spread_cents=12,
              progress_callback=progress,
          ))
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/mlb_strikeout_efficiency_map.json').write_text(
              json.dumps(result, indent=2, default=str), encoding='utf-8'
          )
          print(json.dumps({
              'unique_contracts_with_any_snapshot': result.get('unique_contracts_with_any_snapshot'),
              'contracts_with_complete_path': result.get('contracts_with_complete_path'),
              'intervals': result.get('intervals'),
              'continuation_after_3c_move': result.get('continuation_after_3c_move'),
              'complete_path_summary': result.get('complete_path_summary'),
          }, indent=2, default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mlb-strikeout-efficiency-map
          path: artifacts/mlb_strikeout_efficiency_map.json
          retention-days: 30
