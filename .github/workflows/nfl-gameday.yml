name: NFL Game Day Engine
on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional slate date (YYYY-MM-DD)"
        required: false
        default: ""
        type: string
      event_filter:
        description: "Optional game/event substring, e.g. IND-KC"
        required: false
        default: ""
        type: string
      fail_stage:
        description: "Failure injection stage"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - receiving
          - rushing
          - ffpts
          - card

permissions:
  contents: read

concurrency:
  group: nfl-gameday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gameday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NFL_TARGET_DATE: ${{ inputs.target_date || '' }}
      NFL_EVENT_FILTER: ${{ inputs.event_filter || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn requests tabulate
      - name: Syntax preflight
        run: python -m py_compile research/nfl_gameday/run.py

      - name: Capture markets
        run: python research/nfl_gameday/run.py capture
      - name: Checkpoint raw market capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-gameday-raw-${{ github.run_id }}
          path: research/nfl_gameday/output/raw/
          if-no-files-found: warn

      - name: Run receiving model
        id: receiving
        env:
          NFL_FAIL_STAGE: ${{ inputs.fail_stage || 'none' }}
        continue-on-error: true
        run: python research/nfl_gameday/run.py receiving
      - name: Run rushing model
        id: rushing
        env:
          NFL_FAIL_STAGE: ${{ inputs.fail_stage || 'none' }}
        continue-on-error: true
        run: python research/nfl_gameday/run.py rushing

      - name: Run fantasy-points model
        id: ffpts
        env:
          NFL_FAIL_STAGE: ${{ inputs.fail_stage || 'none' }}
        continue-on-error: true
        run: python research/nfl_gameday/run.py ffpts

      - name: Checkpoint model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-gameday-models-${{ github.run_id }}
          path: research/nfl_gameday/output/models/
          if-no-files-found: warn

      - name: Build unified card
        id: card
        env:
          NFL_FAIL_STAGE: ${{ inputs.fail_stage || 'none' }}
        continue-on-error: true
        run: python research/nfl_gameday/run.py card

      - name: Build health report
        if: always()
        run: python research/nfl_gameday/run.py health

      - name: Publish final checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-gameday-final-${{ github.run_id }}
          path: research/nfl_gameday/output/
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if [ -f research/nfl_gameday/output/HEALTH.md ]; then cat research/nfl_gameday/output/HEALTH.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f research/nfl_gameday/output/CARD.md ]; then cat research/nfl_gameday/output/CARD.md >> "$GITHUB_STEP_SUMMARY"; fi
