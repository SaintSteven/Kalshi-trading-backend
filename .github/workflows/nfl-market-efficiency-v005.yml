name: NFL Market Efficiency v0.05 Entry Timing
on:
  workflow_dispatch:
  push:
    branches: [nfl-market-efficiency-v005-entry-timing]
    paths:
      - 'research/nfl_market_efficiency_v005/**'
      - '.github/workflows/nfl-market-efficiency-v005.yml'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests tabulate
      - name: Build fresh archive inventory
        run: python research/nfl_market_efficiency_v002/scanner.py --out nfl_market_efficiency_v002_output
      - name: Require inventory
        run: test -s nfl_market_efficiency_v002_output/nfl_market_inventory.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-v005-inventory-${{ github.run_number }}
          path: nfl_market_efficiency_v002_output/nfl_market_inventory.csv
          retention-days: 7

  scan:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        prop_class: [player_tds, receiving_yards, receptions, rushing_yards, passing_yards]
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - uses: actions/download-artifact@v4
        with:
          name: nfl-v005-inventory-${{ github.run_number }}
          path: inventory
      - name: Scan timing ${{ matrix.prop_class }} shard ${{ matrix.shard }}
        run: |
          python research/nfl_market_efficiency_v005/timing_scanner.py \
            --inventory inventory/nfl_market_inventory.csv \
            --out shard_output \
            --prop-class '${{ matrix.prop_class }}' \
            --shard-index '${{ matrix.shard }}' \
            --shard-count 8
      - name: Require shard output
        run: test -s shard_output/timing_ledger.csv && test -s shard_output/SHARD_DONE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-v005-shard-${{ matrix.prop_class }}-${{ matrix.shard }}-${{ github.run_number }}
          path: shard_output/
          retention-days: 14

  analyze:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas tabulate
      - uses: actions/download-artifact@v4
        with:
          pattern: nfl-v005-shard-*-${{ github.run_number }}
          path: shard_artifacts
          merge-multiple: false
      - name: Analyze entry timing
        run: python research/nfl_market_efficiency_v005/analyze_timing.py --root shard_artifacts --out timing_analysis
      - name: Require outputs
        run: test -s timing_analysis/SUMMARY.md && test -s timing_analysis/frozen_rule_timing_summary.csv && test -s timing_analysis/best_window_by_frozen_rule.csv
      - name: Write summary
        run: cat timing_analysis/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-market-efficiency-v005-entry-timing-${{ github.run_number }}
          path: timing_analysis/
          retention-days: 30
