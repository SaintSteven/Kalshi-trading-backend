name: NFL Prospective Paper v0.01

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/nfl_prospective_paper_v001/runner.py'
      - 'research/nfl_prospective_paper_v001/snapshot_collector.py'
      - 'research/nfl_prospective_paper_v001/prospective_rules.json'
      - 'research/nfl_prospective_paper_v001/TRIGGER'
      - '.github/workflows/nfl-prospective-paper-v001.yml'

permissions:
  contents: write

concurrency:
  group: nfl-prospective-paper-v001
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests tabulate
      - name: Run Week 1 market snapshot collector
        run: |
          python research/nfl_prospective_paper_v001/snapshot_collector.py \
            --snapshots research/nfl_prospective_paper_v001/data/market_snapshots.csv \
            --current research/nfl_prospective_paper_v001/data/current_markets.csv \
            --health research/nfl_prospective_paper_v001/data/collector_health.csv
      - name: Run prospective paper collector
        run: |
          python research/nfl_prospective_paper_v001/runner.py \
            --rules research/nfl_prospective_paper_v001/prospective_rules.json \
            --ledger research/nfl_prospective_paper_v001/data/ledger.csv \
            --scorecard-dir research/nfl_prospective_paper_v001/data \
            --grace-minutes 12
      - name: Commit prospective data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nfl_prospective_paper_v001/data/ledger.csv \
                  research/nfl_prospective_paper_v001/data/scorecard.csv \
                  research/nfl_prospective_paper_v001/data/SCORECARD.md \
                  research/nfl_prospective_paper_v001/data/market_snapshots.csv \
                  research/nfl_prospective_paper_v001/data/current_markets.csv \
                  research/nfl_prospective_paper_v001/data/collector_health.csv
          if git diff --cached --quiet; then
            echo 'No prospective changes to commit.'
            exit 0
          fi
          git commit -m 'Update NFL prospective paper and market snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish scorecard summary
        run: |
          if [ -s research/nfl_prospective_paper_v001/data/SCORECARD.md ]; then
            cat research/nfl_prospective_paper_v001/data/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"
          fi
