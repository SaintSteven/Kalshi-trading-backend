name: NFL Prospective Paper v0.01
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/nfl_prospective_paper_v001/*.py'
      - 'research/nfl_prospective_paper_v001/prospective_rules.json'
      - 'research/nfl_prospective_paper_v001/TRIGGER'
      - '.github/workflows/nfl-prospective-paper-v001.yml'
permissions:
  contents: write
concurrency:
  group: nfl-prospective-paper-v001
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests tabulate
      - name: Regression tests
        run: python research/nfl_prospective_paper_v001/test_v002.py
      - name: Collect verified NFL market snapshots
        run: |
          python research/nfl_prospective_paper_v001/snapshot_v002.py \
            --snapshots research/nfl_prospective_paper_v001/data/market_snapshots.csv \
            --current research/nfl_prospective_paper_v001/data/current_markets.csv \
            --health research/nfl_prospective_paper_v001/data/collector_health.csv \
            --history research/nfl_prospective_paper_v001/data/quote_history.csv
      - name: Generate independent 2026 receiving projections
        run: |
          python research/nfl_prospective_paper_v001/generate_receiving_projections.py \
            --markets research/nfl_prospective_paper_v001/data/current_markets.csv \
            --projections research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv \
            --mapping research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv \
            --simulations 5000
      - name: Build independent receiving feed
        run: |
          python research/nfl_prospective_paper_v001/receiving_feed.py \
            --markets research/nfl_prospective_paper_v001/data/current_markets.csv \
            --projections research/nfl_prospective_paper_v001/data/independent_receiving_projections.csv \
            --mapping research/nfl_prospective_paper_v001/data/receiving_market_mapping.csv \
            --output research/nfl_prospective_paper_v001/data/receiving_fair_values.csv
      - name: Build Week 1 pilot card
        run: python research/nfl_prospective_paper_v001/build_pilot_card.py
      - name: Run frozen prospective paper collector
        run: |
          python research/nfl_prospective_paper_v001/runner_v002.py \
            --rules research/nfl_prospective_paper_v001/prospective_rules.json \
            --ledger research/nfl_prospective_paper_v001/data/ledger.csv \
            --scorecard-dir research/nfl_prospective_paper_v001/data \
            --grace-minutes 12
      - name: Commit prospective data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nfl_prospective_paper_v001/data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update NFL prospective paper, projections, pilot card, and market snapshots'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish scorecard summary
        run: |
          if [ -s research/nfl_prospective_paper_v001/data/PILOT_CARD.md ]; then
            cat research/nfl_prospective_paper_v001/data/PILOT_CARD.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s research/nfl_prospective_paper_v001/data/SCORECARD.md ]; then
            cat research/nfl_prospective_paper_v001/data/SCORECARD.md >> "$GITHUB_STEP_SUMMARY"
          fi
