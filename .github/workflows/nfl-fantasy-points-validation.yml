name: NFL Fantasy Points Validation
on:
  push:
    branches: [ "research/nfl-fantasy-points-validation-v1" ]
    paths:
      - ".github/workflows/nfl-fantasy-points-validation.yml"
      - "research/nfl_fantasy_points_validation/**"
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn
      - name: Test 00 - independent fantasy-points walk-forward baseline
        run: python research/nfl_fantasy_points_validation/00_walk_forward_baseline.py
      - name: Test 01 - threshold-probability calibration
        run: python research/nfl_fantasy_points_validation/01_threshold_probability_calibration.py
      - name: Test 02 - walk-forward probability recalibration
        run: python research/nfl_fantasy_points_validation/02_probability_recalibration.py
      - name: Test 04 - distribution and walk-forward recalibration comparison
        run: python research/nfl_fantasy_points_validation/04_distribution_recalibration.py
      - name: Test 05 - core-tail and position calibration
        run: python research/nfl_fantasy_points_validation/05_core_tail_position.py
      - name: Test 06 - Week 1 and role-context diagnostics
        run: python research/nfl_fantasy_points_validation/06_week1_role_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-fantasy-points-validation
          path: research/nfl_fantasy_points_validation/results/
